name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: true
        default: true
        type: boolean
      release_tag:
        description: 'Custom Release Tag (e.g. v1.0.0, defaults to "latest")'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare build environment & keystore
        run: |
          # 1. Restore or create debug keystore for signing APK builds
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Ensure .env exists to satisfy secrets gradle plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Run Play Protect privacy verification & local unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Package & Prepare Release Artifacts
        id: package_apk
        run: |
          mkdir -p release-artifacts
          
          # Locate built debug apk
          BUILT_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$BUILT_APK" ]; then
            cp "$BUILT_APK" release-artifacts/OpenCapsule-latest.apk
            cp "$BUILT_APK" release-artifacts/OpenCapsule-debug.apk
            
            # If tag exists, create a versioned copy
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              TAG_NAME="${GITHUB_REF#refs/tags/}"
              cp "$BUILT_APK" "release-artifacts/OpenCapsule-${TAG_NAME}.apk"
            fi
          fi

          # Compute SHA-256 Checksums
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cd ..

      - name: Generate APK build summary
        run: |
          echo "### 📦 APK Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          for f in release-artifacts/*.apk; do
            if [ -f "$f" ]; then
              filename=$(basename "$f")
              filesize=$(ls -lh "$f" | awk '{print $5}')
              sha=$(sha256sum "$f" | awk '{print $1}')
              echo "| \`$filename\` | $filesize | \`$sha\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencapsule-apks
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Details
        id: release_info
        if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="OpenCapsule $TAG"
            IS_PRERELEASE=false
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            TITLE="OpenCapsule $TAG"
            IS_PRERELEASE=false
          else
            TAG="latest"
            TITLE="OpenCapsule Latest Build"
            IS_PRERELEASE=false
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Release
        if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
          body: |
            ## 🚀 OpenCapsule Build Release (${{ steps.release_info.outputs.tag }})

            Automated production build generated from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            ---

            ### 📦 Download & Install
            Download **`OpenCapsule-latest.apk`** below to install directly on your Android device (Android 8.0+ / API 26+).

            ### 🛡️ Privacy & Security Guarantees
            - **100% Offline**: Zero `android.permission.INTERNET` declared; physically incapable of data transmission.
            - **Zero Telemetry**: No tracking SDKs, no behavioral analytics, no external services.
            - **Volatile Processing**: Notification alerts processed strictly in temporary volatile memory.
            - **No Accessibility Abuse**: Standard non-intrusive `WindowManager` overlay around front camera punch-holes.

            ### 📋 Checksums
            Please verify the integrity of your download:
            ```
            $(cat release-artifacts/SHA256SUMS.txt)
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
